# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=2.84.6
maven_group=com.bloomlet.herobrine

# Dependencies
fabric_api_version=0.156.0+26.2

# WHERE THE JDKS ARE, because Gradle's auto-detection does not look in Homebrew's
# opt directory and the toolchain in build.gradle needs to find Java 26 there.
# Auto-download is off on purpose: a build that quietly fetches a JDK over the
# network is a build that behaves differently on a plane.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk,/opt/homebrew/opt/openjdk@26,/opt/homebrew/opt/openjdk@21
org.gradle.java.installations.auto-download=false
